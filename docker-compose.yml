services:
  postgres:
    image: postgres:16
    container_name: h20-store-postgres
    environment:
      POSTGRES_DB: h20_store
      POSTGRES_USER: h20_user
      POSTGRES_PASSWORD: h20_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
